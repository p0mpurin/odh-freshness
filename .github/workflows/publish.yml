# Checks the Open Data Hub every hour and publishes the report to GitHub Pages.
# Actions are pinned to commit SHAs and checkout does not keep credentials,
# following the hardening proposed in opendatahub-collectors issue #76.
name: Publish freshness report

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17, off the busy :00 mark
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARTO_API_KEY: ${{ vars.CARTO_API_KEY }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check the Open Data Hub
        run: go run . -out public
        env:
          CARTO_API_KEY: ${{ vars.CARTO_API_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
